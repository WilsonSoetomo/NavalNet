<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NavalNet Battleship</title>
<style>
:root {
  --bg: #0a0e1a;
  --panel: #111827;
  --card: #1a2235;
  --border: #2a3548;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --accent: #06b6d4;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --muted: #64748b;
  --water: #172554;
  --water-h: #1e3a5f;
  --cell: 44px;
  --gap: 3px;
  --rad: 4px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}

header{width:100%;background:var(--panel);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;gap:16px;justify-content:center}
header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
header h1 span{color:var(--accent)}
header .vs{font-size:14px;color:var(--text2);margin-left:12px}

.controls{display:flex;flex-wrap:wrap;gap:10px;padding:16px 24px;align-items:center;justify-content:center}
.controls select,.controls button{background:var(--card);color:var(--text);border:1px solid var(--border);
  padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;transition:all .15s}
.controls select:hover,.controls button:hover{border-color:var(--accent);background:#1e293b}
.controls button.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.controls button.primary:hover{background:#0891b2}
.controls .reveal-btn.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:var(--accent)}
.controls .sep{width:1px;height:28px;background:var(--border)}
.controls label{font-size:13px;color:var(--text2)}

.status{display:flex;gap:24px;padding:8px 24px 4px;font-size:14px;color:var(--text2);justify-content:center;flex-wrap:wrap}
.status .stat{display:flex;align-items:center;gap:6px}
.status .num{font-weight:700;color:var(--text)}
.status .green{color:var(--green)}
.status .red{color:var(--red)}

.placement-info{text-align:center;padding:10px;font-size:15px;color:var(--amber);font-weight:600;min-height:38px}

.boards{display:flex;gap:48px;padding:8px 24px 16px;justify-content:center;flex-wrap:wrap}
.board-section h3{text-align:center;font-size:14px;font-weight:600;color:var(--text2);
  margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.board-section h3.defense-title{color:var(--green)}
.board-section h3.attack-title{color:var(--red)}

.grid-wrap{position:relative}
.grid{display:grid;grid-template-columns:28px repeat(10,var(--cell));grid-template-rows:28px repeat(10,var(--cell));gap:var(--gap)}
.grid .hdr{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.grid .corner{grid-row:1;grid-column:1}

.cell{border-radius:var(--rad);display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;transition:background .12s,transform .1s,box-shadow .15s;
  position:relative;user-select:none}
.cell.water{background:var(--water)}
.cell.ship{background:#166534}
.cell.unknown{background:var(--water)}
.cell.hit{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,.4)}
.cell.miss{background:#334155}
.cell.miss::after{content:'';width:10px;height:10px;border-radius:50%;background:#64748b}
.cell.sunk{background:#7f1d1d}
.cell.sunk::after{content:'\00d7';font-size:22px;color:#fca5a5}
.cell.revealed-ship{background:rgba(22,101,52,.25);border:1px dashed rgba(34,197,94,.4)}

.cell.clickable{cursor:crosshair}
.cell.clickable:hover{background:var(--water-h);transform:scale(1.06);z-index:2}
.cell.preview-valid{background:rgba(34,197,94,.35) !important;border:2px solid var(--green)}
.cell.preview-invalid{background:rgba(239,68,68,.25) !important;border:2px solid var(--red)}

.cell.flash-hit{animation:flashHit .4s}
@keyframes flashHit{0%{transform:scale(1.3);box-shadow:0 0 20px rgba(239,68,68,.8)}100%{transform:scale(1);box-shadow:0 0 8px rgba(239,68,68,.4)}}
.cell.flash-miss{animation:flashMiss .3s}
@keyframes flashMiss{0%{transform:scale(1.15)}100%{transform:scale(1)}}
.cell.flash-sunk{animation:flashSunk .5s}
@keyframes flashSunk{0%,50%{transform:rotate(-3deg) scale(1.1)}25%,75%{transform:rotate(3deg) scale(1.1)}100%{transform:rotate(0) scale(1)}}

.cell.opp-hit{animation:flashHit .4s}
.cell.opp-sunk{animation:flashSunk .5s}

.dimmed{opacity:.4;pointer-events:none}

.messages{width:100%;max-width:980px;padding:0 24px}
.messages h4{font-size:13px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.msg-list{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  height:130px;overflow-y:auto;padding:8px 12px;font-size:13px;line-height:1.6;font-family:'Menlo','Consolas',monospace}
.msg-list .m{color:var(--text2)}
.msg-list .m.hit-msg{color:var(--red);font-weight:600}
.msg-list .m.sunk-msg{color:var(--red);font-weight:700}
.msg-list .m.opp-msg{color:var(--amber)}
.msg-list .m.system-msg{color:var(--accent)}
.msg-list .m.win-msg{color:var(--green);font-weight:700;font-size:15px}
.msg-list .m.lose-msg{color:var(--red);font-weight:700;font-size:15px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;
  justify-content:center;z-index:100}
.overlay-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:32px 40px;text-align:center;max-width:400px}
.overlay-card h2{font-size:28px;margin-bottom:8px}
.overlay-card p{color:var(--text2);margin-bottom:20px}
.overlay-card button{padding:10px 24px;font-size:15px;font-weight:600;border-radius:8px;
  border:none;cursor:pointer;background:var(--accent);color:#000}
.overlay-card button:hover{background:#0891b2}
.hidden{display:none !important}

.keyboard-hint{text-align:center;font-size:12px;color:var(--muted);padding:4px}
</style>
</head>
<body>

<header>
  <h1><span>Naval</span>Net Battleship</h1>
  <span class="vs" id="vs-label"></span>
</header>

<div class="controls">
  <label>Opponent:</label>
  <select id="opp-select">
    <option value="random">Random Bot</option>
    <option value="hunt_target">Hunt/Target Bot</option>
  </select>
  <button class="primary" id="btn-new">New Game</button>
  <div class="sep"></div>
  <button id="btn-random-place" class="hidden">Random Place</button>
  <button id="btn-rotate" class="hidden">Rotate (R): H</button>
  <div class="sep"></div>
  <button id="btn-reveal" class="reveal-btn">Reveal Ships</button>
</div>

<div class="status">
  <div class="stat">Your ships: <span class="num green" id="my-alive">0</span>/<span id="my-total">0</span></div>
  <div class="stat">Enemy ships: <span class="num red" id="opp-alive">0</span>/<span id="opp-total">0</span></div>
  <div class="stat">Your shots: <span class="num" id="p-shots">0</span></div>
  <div class="stat">Enemy shots: <span class="num" id="o-shots">0</span></div>
</div>

<div class="placement-info" id="placement-info"></div>

<div class="boards">
  <div class="board-section" id="defense-section">
    <h3 class="defense-title">Your Board (Defense)</h3>
    <div class="grid-wrap"><div class="grid" id="defense-grid"></div></div>
  </div>
  <div class="board-section" id="attack-section">
    <h3 class="attack-title">Attack Board</h3>
    <div class="grid-wrap"><div class="grid" id="attack-grid"></div></div>
  </div>
</div>

<div class="keyboard-hint" id="kb-hint"></div>

<div class="messages">
  <h4>Log</h4>
  <div class="msg-list" id="msg-list"></div>
</div>

<div class="overlay hidden" id="gameover-overlay">
  <div class="overlay-card">
    <h2 id="go-title"></h2>
    <p id="go-subtitle"></p>
    <button id="btn-play-again">Play Again</button>
  </div>
</div>

<script>
const G = 10;
const COLS = 'ABCDEFGHIJ';

let S = null;       // server state
let orient = 0;     // local orientation tracker
let animating = false;

// ── Grid construction ─────────────────────────────────────────────
function buildGrid(container, type) {
  container.innerHTML = '';
  const corner = document.createElement('div');
  corner.className = 'hdr corner';
  container.appendChild(corner);
  for (let c = 0; c < G; c++) {
    const h = document.createElement('div');
    h.className = 'hdr';
    h.textContent = COLS[c];
    h.style.gridRow = '1';
    h.style.gridColumn = c + 2;
    container.appendChild(h);
  }
  for (let r = 0; r < G; r++) {
    const lbl = document.createElement('div');
    lbl.className = 'hdr';
    lbl.textContent = r;
    lbl.style.gridRow = r + 2;
    lbl.style.gridColumn = '1';
    container.appendChild(lbl);
    for (let c = 0; c < G; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.dataset.type = type;
      cell.style.gridRow = r + 2;
      cell.style.gridColumn = c + 2;
      container.appendChild(cell);
    }
  }
}

function getCell(type, r, c) {
  return document.querySelector(`.cell[data-type="${type}"][data-r="${r}"][data-c="${c}"]`);
}

// ── API helpers ───────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {method, headers: {'Content-Type': 'application/json'}};
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

async function fetchState() { S = await api('GET', '/api/state'); }
async function fetchModels() {
  const data = await api('GET', '/api/models');
  const sel = document.getElementById('opp-select');
  for (const m of data.models) {
    const opt = document.createElement('option');
    opt.value = m.path;
    opt.textContent = `${m.type.toUpperCase()}: ${m.name}`;
    opt.dataset.mtype = m.type;
    sel.appendChild(opt);
  }
}

// ── Rendering ─────────────────────────────────────────────────────
function render() {
  if (!S) return;
  const phase = S.phase;

  // VS label
  document.getElementById('vs-label').textContent =
    S.opponent_name ? `vs ${S.opponent_name}` : '';

  // Stats
  document.getElementById('my-alive').textContent = S.my_alive;
  document.getElementById('my-total').textContent = S.my_total;
  document.getElementById('opp-alive').textContent = S.opp_alive;
  document.getElementById('opp-total').textContent = S.opp_total;
  document.getElementById('p-shots').textContent = S.player_shots;
  document.getElementById('o-shots').textContent = S.opp_shots;

  // Placement controls
  const btnRP = document.getElementById('btn-random-place');
  const btnRot = document.getElementById('btn-rotate');
  if (phase === 'placement') {
    btnRP.classList.remove('hidden');
    btnRot.classList.remove('hidden');
    btnRot.textContent = `Rotate (R): ${orient === 0 ? 'H' : 'V'}`;
  } else {
    btnRP.classList.add('hidden');
    btnRot.classList.add('hidden');
  }

  // Placement info
  const pInfo = document.getElementById('placement-info');
  if (phase === 'placement' && S.current_ship) {
    pInfo.textContent = `Placing: ${S.current_ship.name} (length ${S.current_ship.length}) — click your board`;
  } else if (phase === 'shooting') {
    pInfo.textContent = 'Click the attack board to fire!';
  } else if (phase === 'gameover') {
    pInfo.textContent = '';
  } else {
    pInfo.textContent = 'Start a new game above.';
  }

  // Keyboard hint
  const kbHint = document.getElementById('kb-hint');
  kbHint.textContent = phase === 'placement' ? 'Press R to rotate ship orientation' : '';

  // Reveal button
  const revBtn = document.getElementById('btn-reveal');
  revBtn.classList.toggle('active', S.reveal);
  revBtn.textContent = S.reveal ? 'Reveal: ON' : 'Reveal Ships';

  // Defense board
  const defDim = (phase === 'shooting' || phase === 'gameover') ? '' : '';
  renderDefense();

  // Attack board
  renderAttack();

  // Dim boards contextually
  document.getElementById('attack-section').classList.toggle('dimmed',
    phase === 'placement' || phase === 'menu');

  // Messages
  renderMessages();

  // Game over overlay
  const goOverlay = document.getElementById('gameover-overlay');
  if (phase === 'gameover') {
    goOverlay.classList.remove('hidden');
    if (S.winner === 'player') {
      document.getElementById('go-title').textContent = 'Victory!';
      document.getElementById('go-title').style.color = 'var(--green)';
      document.getElementById('go-subtitle').textContent =
        `You sunk the enemy fleet in ${S.player_shots} shots.`;
    } else {
      document.getElementById('go-title').textContent = 'Defeat';
      document.getElementById('go-title').style.color = 'var(--red)';
      document.getElementById('go-subtitle').textContent =
        `${S.opponent_name} sunk your fleet in ${S.opp_shots} shots.`;
    }
  } else {
    goOverlay.classList.add('hidden');
  }
}

function renderDefense() {
  if (!S || !S.defense) return;
  for (let r = 0; r < G; r++) {
    for (let c = 0; c < G; c++) {
      const cell = getCell('def', r, c);
      if (!cell) continue;
      const v = S.defense[r][c];
      cell.className = 'cell ' + v;
      if (S.phase === 'placement') cell.classList.add('clickable');
    }
  }
}

function renderAttack() {
  if (!S || !S.attack) return;
  for (let r = 0; r < G; r++) {
    for (let c = 0; c < G; c++) {
      const cell = getCell('atk', r, c);
      if (!cell) continue;
      let v = S.attack[r][c];
      cell.className = 'cell ' + v;
      if (v === 'unknown' && S.opponent_ships && S.opponent_ships[r][c]) {
        cell.classList.add('revealed-ship');
      }
      if (v === 'unknown' && S.phase === 'shooting' && !animating) {
        cell.classList.add('clickable');
      }
    }
  }
}

function renderMessages() {
  const list = document.getElementById('msg-list');
  list.innerHTML = '';
  if (!S) return;
  for (const msg of S.messages) {
    const d = document.createElement('div');
    d.className = 'm';
    if (msg.includes('HIT & SUNK') || msg.includes('SUNK')) d.className += ' sunk-msg';
    else if (msg.includes('HIT')) d.className += ' hit-msg';
    if (msg.startsWith('Enemy')) d.className += ' opp-msg';
    if (msg.includes('WIN')) d.className += ' win-msg';
    if (msg.includes('LOSE')) d.className += ' lose-msg';
    if (msg.includes('started') || msg.includes('Place') || msg.includes('fire')) d.className += ' system-msg';
    d.textContent = msg;
    list.appendChild(d);
  }
  list.scrollTop = list.scrollHeight;
}

// ── Placement preview ─────────────────────────────────────────────
function shipCells(r, c, len, ori) {
  const cells = [];
  for (let i = 0; i < len; i++) {
    cells.push(ori === 0 ? [r, c + i] : [r + i, c]);
  }
  return cells;
}

function isValidLocal(cells) {
  if (!S || !S.defense) return false;
  for (const [r, c] of cells) {
    if (r < 0 || r >= G || c < 0 || c >= G) return false;
    if (S.defense[r][c] !== 'water') return false;
  }
  return true;
}

let previewCells = [];
function showPreview(r, c) {
  clearPreview();
  if (!S || S.phase !== 'placement' || !S.current_ship) return;
  const cells = shipCells(r, c, S.current_ship.length, orient);
  const valid = isValidLocal(cells);
  const cls = valid ? 'preview-valid' : 'preview-invalid';
  for (const [pr, pc] of cells) {
    if (pr >= 0 && pr < G && pc >= 0 && pc < G) {
      const el = getCell('def', pr, pc);
      if (el) { el.classList.add(cls); previewCells.push(el); }
    }
  }
}

function clearPreview() {
  for (const el of previewCells) {
    el.classList.remove('preview-valid', 'preview-invalid');
  }
  previewCells = [];
}

// ── Animations ────────────────────────────────────────────────────
function flashCell(cell, cls) {
  cell.classList.add(cls);
  setTimeout(() => cell.classList.remove(cls), 500);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function animateOpponentTurn(actions) {
  animating = true;
  render();
  for (const a of actions) {
    await sleep(400);
    const cell = getCell('def', a.row, a.col);
    if (!cell) continue;
    if (a.result === 'sunk') {
      cell.className = 'cell sunk';
      flashCell(cell, 'opp-sunk');
      // Also update other cells of the sunk ship
      for (let r = 0; r < G; r++) {
        for (let c = 0; c < G; c++) {
          if (S.defense[r][c] === 'sunk') {
            const sc = getCell('def', r, c);
            if (sc) sc.className = 'cell sunk';
          }
        }
      }
    } else if (a.result === 'hit') {
      cell.className = 'cell hit';
      flashCell(cell, 'opp-hit');
    } else {
      cell.className = 'cell miss';
      flashCell(cell, 'flash-miss');
    }
    renderMessages();
  }
  animating = false;
}

// ── Event handlers ────────────────────────────────────────────────

// Defense grid (placement)
document.getElementById('defense-grid').addEventListener('click', async (e) => {
  const cell = e.target.closest('.cell');
  if (!cell || S.phase !== 'placement' || !S.current_ship) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  const cells = shipCells(r, c, S.current_ship.length, orient);
  if (!isValidLocal(cells)) return;
  const data = await api('POST', '/api/place', {row: r, col: c});
  S = data.state;
  clearPreview();
  render();
});

document.getElementById('defense-grid').addEventListener('mouseover', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell || S.phase !== 'placement') return;
  showPreview(+cell.dataset.r, +cell.dataset.c);
});

document.getElementById('defense-grid').addEventListener('mouseleave', () => clearPreview());

// Attack grid (shooting)
document.getElementById('attack-grid').addEventListener('click', async (e) => {
  const cell = e.target.closest('.cell');
  if (!cell || S.phase !== 'shooting' || animating) return;
  if (!cell.classList.contains('unknown')) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  const data = await api('POST', '/api/shoot', {row: r, col: c});
  if (data.error) return;
  S = data.state;

  // Flash the player's shot
  const atkCell = getCell('atk', r, c);
  if (data.result === 'sunk') {
    render();
    flashCell(atkCell, 'flash-sunk');
  } else if (data.result === 'hit') {
    render();
    flashCell(atkCell, 'flash-hit');
  } else {
    render();
    flashCell(atkCell, 'flash-miss');
  }

  // Animate opponent turn if any
  if (data.opponent_turn && data.opponent_turn.length > 0) {
    await sleep(300);
    await animateOpponentTurn(data.opponent_turn);
  }

  render();
});

// Controls
document.getElementById('btn-new').addEventListener('click', async () => {
  const sel = document.getElementById('opp-select');
  const val = sel.value;
  const opt = sel.selectedOptions[0];
  const mt = opt.dataset.mtype || 'dqn';
  orient = 0;
  S = await api('POST', '/api/new', {opponent: val, model_type: mt});
  render();
});

document.getElementById('btn-random-place').addEventListener('click', async () => {
  S = await api('POST', '/api/place-random');
  render();
});

document.getElementById('btn-rotate').addEventListener('click', async () => {
  orient = orient === 0 ? 1 : 0;
  const data = await api('POST', '/api/rotate');
  S = data.state;
  render();
});

document.getElementById('btn-reveal').addEventListener('click', async () => {
  S = await api('POST', '/api/toggle-reveal');
  render();
});

document.getElementById('btn-play-again').addEventListener('click', () => {
  document.getElementById('gameover-overlay').classList.add('hidden');
  document.getElementById('btn-new').click();
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    if (S && S.phase === 'placement') {
      document.getElementById('btn-rotate').click();
    }
  }
});

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  buildGrid(document.getElementById('defense-grid'), 'def');
  buildGrid(document.getElementById('attack-grid'), 'atk');
  await fetchModels();
  await fetchState();
  render();
}

init();
</script>
</body>
</html>
